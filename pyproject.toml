[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "census-extractor"
version = "0.2.0"
description = "Auditable Novita OCR pipeline for the 1971 Uttar Pradesh census tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.25",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyarrow>=12.0",
  "pydantic>=2.0",
  "pymupdf>=1.23",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pip-audit>=2.7", "pyright>=1.1.390", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.9"]

[project.scripts]
census-extract = "census_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/census_extractor"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=census_extractor --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["Project-dashboard", "1971_Trimmed_PDF/Uttar_Pradesh/up1971_pdf_trimmer.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "cli.py"]
exclude = ["1971_Trimmed_PDF/Uttar_Pradesh/outputs", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
