name: Census extraction pipeline

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "cli.py"
      - "1971_Trimmed_PDF/Uttar_Pradesh/schemas/**"
      - ".github/workflows/pipeline.yml"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pyright
      - run: pytest
      - run: python -m build
      - run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
