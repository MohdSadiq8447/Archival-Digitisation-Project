name: Update Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Download Excel files from Dropbox
        run: |
          mkdir -p data
          curl -L -o data/Census_1971.xlsx "${{ secrets.DROPBOX_CENSUS_1971_URL }}"
          curl -L -o data/Census_1981.xlsx "${{ secrets.DROPBOX_CENSUS_1981_URL }}"

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated data files
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json stats.json data/Census_1971.xlsx data/Census_1981.xlsx
          git diff --staged --quiet || git commit -m "Auto-update dashboard data [skip ci]"
          git push
