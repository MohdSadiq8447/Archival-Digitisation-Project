name: Update Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Download Excel files from Dropbox
        run: |
          curl -L -o data/Census_1971.xlsx "${{ secrets.DROPBOX_CENSUS_1971_URL }}"
          curl -L -o data/Census_1981.xlsx "${{ secrets.DROPBOX_CENSUS_1981_URL }}"

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json stats.json data/Census_1971.xlsx data/Census_1981.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update dashboard data"
            git push
          fi
