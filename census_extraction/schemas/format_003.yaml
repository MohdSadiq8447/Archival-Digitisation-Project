      - "DISTRICT"
    note: "Final row gives the district-level total across all tahsils."

notes: >
  Tahsil-wise abstract of educational, medical and other amenities. This is a
  two-page spread that does NOT split columns in simple sequence. The anchor
  page carries the identity columns (1–2), the EDUCATIONAL block (3–12), and
  the lower band with POWER SUPPLY (25–26) and DRINKING WATER (27–38). The
  continuation page carries the MEDICAL block (13–24) and the lower band with
  COMMUNICATIONS/ROADS (39–42) and POST AND TELEGRAPH (43–50). Columns are
  therefore non-contiguous across pages, so the printed_column number — not
  the position in this list — is authoritative. Each institution/facility
  type in Educational, Medical, Power Supply, and Post & Telegraph is a
  category spanning two sub-columns ("villages having" / "count of").
  Drinking Water and Communications list each source/road type as a standalone
  column. The final row is the district total.
